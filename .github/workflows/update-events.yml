name: Eventdaten aktualisieren
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: write
concurrency:
  group: event-crawl
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt
      - name: Offline-Parsertests
        run: python -m unittest discover -s tests -v
      - name: Alle Clubquellen abrufen
        id: scrape
        continue-on-error: true
        run: python -m backend.main
      - name: Aktualisierte Daten speichern
        if: always() && steps.scrape.outcome != 'skipped'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/events.json site/data/quality.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: update venue catalog and quality'
            git pull --rebase
            git push
          fi
      - name: Quellenfehler sichtbar machen
        if: steps.scrape.outcome == 'failure'
        run: |
          echo 'One or more prototype sources did not complete successfully; inspect site/data/quality.json'
          exit 1
